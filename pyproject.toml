[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "StingrayExplorer"
version = "0.1"
description = "A package for analyzing astronomical data."
authors = [{name = "Kartik Mandar", email = "your.email@example.com"}]
dependencies = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
    "stingray",
    # Add other dependencies here if needed
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["python-backend/tests"]

[tool.ruff.lint]
# Ruff 0.17 widened its default rule set. Keep the rules this project has
# enforced so far (the pre-0.17 defaults); adopting the new families is a
# separate code-style migration.
select = ["E4", "E7", "E9", "F"]
